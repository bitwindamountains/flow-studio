# Builds the engine and runs its unit tests (temporary fixtures: no Flow, no browser profile, no credits).
# Windows, because the studio runs its agents through cmd.exe.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm test
