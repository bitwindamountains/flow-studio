<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Studio</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root { --bg:#16181d; --panel:#1e2128; --line:#2f333d; --text:#e6e8ee; --dim:#9aa1b0; --accent:#f59e0b; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; }
  select, button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .chip.low { border-color: var(--warn); color: var(--warn); }
  .chip.out { border-color: var(--bad); color: var(--bad); }
  #health { padding: 6px 12px; background: #4a2a12; color: #fcd9a8; font-size: 14px; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #term-wrap { height: 35vh; min-height: 120px; display: flex; flex-direction: column; background: #000; }
  #term-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim); }
  #term { flex: 1; min-height: 0; padding: 4px; }
  #split { height: 6px; flex: none; cursor: row-resize; background: var(--line); touch-action: none; }
  #split:hover, #split:focus-visible { background: var(--accent); }
  #right { flex: 1; min-height: 150px; display: flex; flex-direction: column; }
  .card.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stale { color: var(--warn); font-size: 13px; font-weight: 600; }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  #tabs button { border: 0; border-radius: 0; padding: 10px 16px; background: transparent; color: var(--dim); }
  #tabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
  #views { flex: 1; overflow: auto; padding: 16px; }
  #views section { color: var(--text); }
  #reloaded { padding: 8px 12px; background: #5a1b1b; color: #fecaca; font-weight: 600; }
  #toast { position: fixed; bottom: 12px; right: 12px; max-width: 420px; background: var(--panel); border: 1px solid var(--accent); padding: 8px 12px; border-radius: 6px; z-index: 9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { width: 100%; }
  h3 { margin: 14px 0 6px; font-size: 14px; color: var(--dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .card img, .card video { width: 100%; border-radius: 4px; margin: 6px 0; }
  .empty { padding: 30px 0; text-align: center; color: var(--dim); }
  .dim { color: var(--dim); font-size: 12px; } .err { color: var(--bad); font-size: 12px; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; }
  button.ok { border-color: #22c55e; color: #86efac; }
  button.big { font-size: 17px; padding: 12px 18px; background: var(--accent); color: #111; font-weight: 700; }
  .held, .lesson { padding: 10px; margin: 8px 0; border: 1px solid var(--accent); border-radius: 8px; }
  .refs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; } .refs figure { width: 84px; } .refs img { width: 84px; height: 84px; object-fit: cover; border-radius: 4px; display: block; } .refs figcaption { font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; } .thumbs figure { width: 96px; } .thumbs video { width: 96px; border-radius: 4px; display: block; } .thumbs figcaption { font-size: 11px; color: var(--dim); }
  video.render { max-width: 100%; max-height: 60vh; background: #000; }
</style>
</head>
<body data-token="__FLOW_TOKEN__" data-owner="__OWNER__">
<header>
  <h1>Flow Studio</h1>
  <select id="project" aria-label="Project"></select>
  <select id="sub" aria-label="Sub-project"></select>
  <div id="chips" aria-label="Accounts"></div>
</header>
<div id="health" hidden></div>
<div id="reloaded" hidden>This window is not the owner's studio window, so it can't approve credits. Close it and reopen Flow Studio.cmd.</div>
<div id="toast" role="status" hidden></div>
<main>
  <div id="right">
    <nav id="tabs" role="tablist">
      <button role="tab" data-view="ideas" aria-selected="true">1 Ideas</button>
      <button role="tab" data-view="plan" aria-selected="false">2 Plan</button>
      <button role="tab" data-view="storyboard" aria-selected="false">3 Storyboard</button>
      <button role="tab" data-view="generate" aria-selected="false">4 Generate</button>
      <button role="tab" data-view="edit" aria-selected="false">5 Edit</button>
    </nav>
    <div id="views">
      <section id="view-ideas"></section>
      <section id="view-plan" hidden></section>
      <section id="view-storyboard" hidden></section>
      <section id="view-generate" hidden></section>
      <section id="view-edit" hidden></section>
    </div>
  </div>
  <div id="split" role="separator" aria-orientation="horizontal" aria-label="Resize Claude terminal (arrow keys)" tabindex="0"></div>
  <div id="term-wrap">
    <div id="term-bar"><span>Claude Code</span><button id="restart" type="button">Restart</button></div>
    <div id="term"></div>
  </div>
</main>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/app.js"></script>
</body>
</html>
